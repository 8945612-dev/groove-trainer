<style>
/* Зин, как в «Кабинете»: бумага, синяя тушь, клочки со скотчем, жёсткие тени. Весь текст тёмно-синий, цвета только в заливках. */
:root{
  --paper:#f3ead3; --ink:#14226b; --soft:#3b4a8a; --pink:#ff58b8; --mag:#c4006c; --yel:#f7dc6a;
  --sky:#bcd9ff; --blush:#ffd0ea; --white:#fffdf5; --mint:#b8ecd0; --table:#cfc8b8;
  --f:Rubik,system-ui,sans-serif; --f-hand:Caveat,'Segoe Script',cursive; --f-mono:'Rubik Mono One',Rubik,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
body{background:var(--table);color:var(--ink);font:400 15px/1.45 var(--f);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.win{position:relative;isolation:isolate;background:var(--paper);color:var(--ink);max-width:820px;margin:0 auto;padding:20px 22px 30px;overflow:hidden}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.1;z-index:9;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.mast{display:flex;justify-content:space-between;font:400 10px var(--f-mono);letter-spacing:.06em;margin-bottom:8px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.day{position:relative;min-width:150px;height:58px}
.day b{position:absolute;left:0;top:-2px;font:700 58px/1 var(--f-hand);transform:rotate(-2deg);text-shadow:3px 3px 0 var(--pink);white-space:nowrap}
.ttl{font:700 26px/1.05 var(--f);letter-spacing:-.025em}
.step{font:700 20px var(--f-hand);color:var(--mag);transform:rotate(-2deg);display:inline-block}
/* клочок */
.scrap{position:relative;padding:14px 16px 14px;margin:0 6px 26px 2px;transform:rotate(var(--r,0deg));background:var(--bg,var(--white));border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);min-width:0}
.scrap.y{--bg:var(--yel);--r:-.6deg}.scrap.b{--bg:var(--blush);--r:.5deg}.scrap.s{--bg:var(--sky);--r:-.4deg}.scrap.m{--bg:var(--mint)}.scrap.w{--r:.3deg}
.tape{position:absolute;top:-11px;left:30px;width:62px;height:18px;background:rgba(247,220,106,.92);transform:rotate(-4deg);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 6%,96% 50%,100% 94%,90% 100%,6% 94%,0 70%,3% 40%)}
.tape.r{left:auto;right:26px;transform:rotate(5deg)}.tape.mg{background:rgba(255,88,184,.85)}
.scrap h4{display:inline-block;font:700 11px var(--f);letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--white);padding:3px 9px 2px;margin-bottom:11px}
.scrap h4 em{font-style:normal;margin-left:6px;color:var(--yel)}
.scrap.y h4{background:var(--pink);color:var(--ink)}.scrap.y h4 em{color:var(--ink)}
.scrap.b h4,.scrap.s h4,.scrap.m h4{background:var(--ink)}
.stkr{position:absolute;right:-6px;top:-22px;width:78px;height:78px;border-radius:50%;background:var(--pink);color:var(--ink);border:2px solid var(--ink);display:grid;place-items:center;text-align:center;font:700 10px/1.05 var(--f);letter-spacing:.04em;transform:rotate(10deg);z-index:3}
.stkr b{display:block;font:700 26px/1 var(--f)}
/* кнопки: жёсткая тень, при нажатии вдавливаются */
.btn,a.btn{display:inline-block;font:700 12px var(--f);letter-spacing:.1em;text-transform:uppercase;background:var(--white);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:7px 13px 6px;cursor:pointer;color:var(--ink);text-decoration:none;line-height:1.3}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--yel)}
.btn.p,.btn.p[aria-pressed="true"]{background:var(--pink)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.play{font:700 20px var(--f);letter-spacing:.06em;padding:13px 26px 12px;min-width:160px}
.arrow{font-size:18px;padding:5px 14px 4px}
.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tg{display:flex;flex-wrap:wrap;gap:10px}
.lbl{font:700 11px var(--f);letter-spacing:.12em;text-transform:uppercase}
.hint{font:400 13px/1.45 var(--f);color:var(--soft)}
.note{background:var(--mint);border:2px dashed var(--ink);padding:10px 12px;font:500 13.5px/1.45 var(--f);color:var(--ink)}
.msg{font:700 20px var(--f-hand);color:var(--mag);min-height:1.2em;transform:rotate(-1deg);transform-origin:left}
.msg.err{color:var(--ink);text-decoration:underline wavy var(--pink)}
.meta{font:500 12px var(--f);color:var(--soft)}
/* список паттернов */
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:128px;overflow:auto;padding:3px 6px 6px 3px}
.chip{font:700 13px var(--f);padding:3px 8px 2px;border:2px solid var(--ink);background:var(--white);box-shadow:2px 2px 0 var(--ink);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--yel);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
/* лист */
.scroll{overflow-x:auto;padding:2px 2px 6px}
.sheet{min-width:560px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px}
.rl{width:22px;flex:none;text-align:center;font:700 12px var(--f)}
.grp{flex:1;display:grid;grid-template-columns:repeat(4,1fr)}
.row.sym .grp{border:2px solid var(--ink);background:var(--white)}
.row.sym .grp.strong{background:var(--sky)}
.cell{height:36px;display:flex;align-items:center;justify-content:center}
.row.sym .cell+.cell{border-left:1.5px dashed rgba(20,34,107,.35)}
.cell svg{width:20px;height:20px;overflow:visible}
.hand{font:700 17px var(--f)}
.hand.u{font-weight:500;font-size:14px}
.hand:not(.u){margin-top:9px}
[hidden]{display:none!important}
.cell{position:relative}
.acc{position:absolute;top:2px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--f);font-style:normal;color:var(--ink)}
.cell.now{background:var(--yel);box-shadow:inset 0 0 0 2px var(--ink)}
.row.txt .cell{height:26px;font:400 13px var(--f);color:var(--soft)}
.row.txt .cell.snd{color:var(--ink);font-weight:700}
.row.txt .cell.beatn{font:700 21px/1 var(--f-hand);color:var(--mag)}
.row.txt .cell.now{background:var(--yel);box-shadow:none}
.muted-row{opacity:.35}
.sel{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.sel label{display:flex;flex-direction:column;gap:5px}
select,.num{background:var(--white);border:2.5px solid var(--ink);padding:6px 10px;font:500 14px var(--f);color:var(--ink);border-radius:0}
select:focus,.num:focus{box-shadow:4px 4px 0 var(--pink)}
.num{width:68px}
/* ползунки */
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:130px;height:14px;background:var(--white);border:2.5px solid var(--ink);border-radius:0;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;background:var(--pink);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;border-radius:0}
input[type=range]::-moz-range-thumb{width:18px;height:22px;background:var(--pink);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;border-radius:0}
.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:210px;font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase}
.beats{display:flex;gap:7px}
.beats i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:var(--white);display:block}
.beats i.on{background:var(--pink)}
.transport{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.nums{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.nums label{display:flex;align-items:center;gap:7px;font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase}
/* раскладка под планшет: слева лист, справа настройки; всё на одном экране */
.win{max-width:1140px;padding:14px 22px 20px}
.top{margin:2px 0 14px}
.scrap{margin:0 6px 18px 2px;padding:12px 14px}
.scrap h4{margin-bottom:9px}
.layout{display:grid;gap:0 18px;grid-template-columns:minmax(0,1fr);align-items:start}
.colL,.colR{min-width:0}
@media (min-width:640px){.colR{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:start}}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .colR{display:block}
  .win{padding:12px 20px 16px}
  .mast{margin-bottom:4px}
  .top{margin:0 0 12px;gap:12px}
  .day{height:46px;min-width:120px}.day b{font-size:46px}
  .arrow{padding:3px 12px 2px}
  .scrap{margin-bottom:8px;padding:10px 12px}
  .scrap h4{margin-bottom:7px}
  .vol{min-width:130px;gap:6px;font-size:10px;letter-spacing:.04em}
  .vol input[type=range]{min-width:60px}
  .btn{padding:5px 10px 4px;font-size:11px;letter-spacing:.06em}
  .play{padding:9px 20px 8px;font-size:17px;min-width:140px}
  .chips{max-height:none;gap:6px;padding:2px 4px 4px 2px}
  .chip{font-size:12px;padding:2px 6px 1px}
  .sheet{min-width:470px;gap:4px}
  .rl{width:18px}
  .cell{height:32px}
  .row.txt .cell{height:22px}
  .transport{gap:11px;margin-top:2px}
  .sel{margin-top:8px;gap:14px}
  .sel label{gap:3px}
  select{padding:4px 8px}
  .num{width:54px;padding:4px 6px}
  .nums{gap:10px}
  .nums label{gap:5px;font-size:10px}
  .msg{font-size:18px}
  .stkr{width:66px;height:66px;top:-20px}.stkr b{font-size:22px}
}
/* блоки ровные: без наклона, колонки одной высоты, нижние края совпадают */
.scrap{transform:none!important}
@media (min-width:640px){.colR{align-items:stretch}}
@media (min-width:1000px){
  .layout{align-items:stretch}
  .colL,.colR{display:flex;flex-direction:column}
  .colL>.scrap:last-child,.colR>.scrap:last-child{flex:1;margin-bottom:0}
}
.train{margin-top:8px;font:700 20px/1.6 var(--f-hand);color:var(--ink)}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num{-moz-appearance:textfield;appearance:textfield}
.train .num{width:46px;margin:0 2px;padding:3px 4px;font-size:14px;vertical-align:middle}
.train.bad .num{box-shadow:0 0 0 3px var(--pink)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:560px){.win{padding:16px 14px 26px}.stkr{right:-4px;top:-26px}.day b{font-size:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.btn:hover,.btn:active,.chip[aria-pressed="true"]{transform:none}}
</style>

</head>

</div><div class="colR">

      <div class="line">

        <label class="vol">Партия <input type="range" id="vPart" min="0" max="100" value="80"></label>
      </div>
    </div>
  </div>

  <div class="scrap s last"><span class="tape"></span>
    <h4>Режим</h4>
    <div class="tg">
      <button class="btn" id="mPad" aria-pressed="false">Пэд</button>
      <button class="btn" id="tTrain" aria-pressed="false">Тренировка: темп растёт</button>

    <div id="padBox" hidden style="margin-top:12px">
      <div class="tg">
        <button class="btn" id="tLeft" aria-pressed="false">Начинать левой</button>
      </div>
    </div>
    </div>
    <div class="train" id="trainBox" hidden>от <input class="num" type="number" id="trFrom" min="40" max="160" value="60" aria-label="Начальный темп"> до <input class="num" type="number" id="trTo" min="40" max="160" value="90" aria-label="Целевой темп">, + <input class="num" type="number" id="trStep" min="1" max="20" value="2" aria-label="Шаг темпа"> каждые <input class="num" type="number" id="trBars" min="1" max="32" value="4" aria-label="Сколько тактов на шаг"> такта</div>
  </div>
</div></div>
</div>

<script>

(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};

/* ---------- данные: паттерны 303–330 (номера шестнадцатых) ---------- */
var EV=[0,2,4,6,8,10,12,14];
var BASE=[
 [303,[0,8],[4,7,12]],[304,[0,8],[4,7,12,15]],[305,[0,3,8],[4,12]],[306,[0,8,11],[4,12,15]],
 [307,[0,3,8,10],[4,12]],[308,[0,3,6,8],[4,12]],[309,[0,3,8,11],[4,12,15]],[310,[0,3,8,11],[4,7,12,15]],
 [311,[0,10],[4,7,12]],[312,[0,2,8],[4,7,12]],[313,[0,2,10,14],[4,7,12]],[314,[2,8,10],[4,7,12,15]],
 [315,[2,10,14],[4,7,12]],[316,[0,10],[4,12,15]],[317,[0,2,10],[4,7,12]],[318,[0,2,11,14],[4,7,12]],
 [319,[0,3,10],[4,12]],[320,[0,3,8],[6,12]],[321,[0,3,8,10],[6,12]],[322,[0,3,10],[6,12]],
 [323,[0,3,10],[4,7,12]],[324,[0,3,10],[4,7,12,15]],[325,[0,3,10],[6,12,15]],[326,[2,8,11],[4,12,15]],
 [327,[2,8,11],[4,7,12]],[328,[2,6,8,11],[4,12,15]],[329,[0,3,8,10],[4,7,12,15]],[330,[0,3,8,10],[6,12,15]]
];
var patterns=BASE.map(function(r){return {id:String(r[0]),h:EV.slice(),k:r[1],s:r[2],mine:false,src:''}});
var cur=0;
/* рудименты: заглавная буква — акцент, строчная — без акцента; длина = один цикл */
var RUD=[
 ['Одиночные','RLRLRLRL'],
 ['Двойные','RRLLRRLL'],
 ['Одиночные с акцентом','RlrlLrlr'],
 ['Двойные с акцентом','RrLlRrLl'],
 ['Парадиддл','RlrrLrll'],
 ['Двойной парадиддл','RlrlrrLrlrll'],
 ['Тройной парадиддл','RlrlrlrrLrlrlrll'],
 ['Парадиддл-диддл','RlrrllLrllrr']
];
var rudiments=RUD.map(function(r){return {id:r[0],seq:r[1]}});
var curR=0,leadLeft=false,rudH=[];
function hands(rd){return rd.seq.split('').map(function(ch){var r=ch.toLowerCase()==='r';return {h:(r!==leadLeft)?'R':'L',acc:ch===ch.toUpperCase()}})}

/* ---------- сохранение ---------- */
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var prefs=load('groove.prefs')||{};

function valid(p){return p&&typeof p.id==='string'&&Array.isArray(p.h)&&Array.isArray(p.s)&&Array.isArray(p.k)}
function clean(a){var o=[];(a||[]).forEach(function(n){n=+n;if(n>=0&&n<=15&&o.indexOf(n)<0)o.push(n)});return o.sort(function(a,b){return a-b})}
function addPattern(p,quiet){
  var q={id:String(p.id),h:clean(p.h),s:clean(p.s),k:clean(p.k),mine:true,src:p.src||'моё'};
  var i=patterns.findIndex(function(x){return x.id===q.id});
  if(i>=0){ if(!patterns[i].mine) q.id=q.id+'·моё'; else {patterns[i]=q;return} }
  patterns.push(q);
}
function persistMine(){save('groove.mine',patterns.filter(function(p){return p.mine}))}

/* ---------- подписи: счёт и слоговые системы ---------- */
function labelFor(sys,i,p){
  var q=i&3,b=i>>2;
  var on=p.h.indexOf(i)>=0||p.s.indexOf(i)>=0||p.k.indexOf(i)>=0;
  if(sys==='count') return {t:[String(b+1),'e','+','a'][q],on:on,beat:q===0};
  if(sys==='takadimi') return {t:['та','ка','ди','ми'][q],on:on,beat:q===0};
  if(sys==='drum'){
    var k=p.k.indexOf(i)>=0,s=p.s.indexOf(i)>=0,h=p.h.indexOf(i)>=0;
    return {t:k?'Бум':s?'Так':h?'ц':'·',on:on,beat:false};
  }
  return null;
}

/* ---------- лист ---------- */
var SYM={
 h:'<svg viewBox="0 0 20 20" fill="none" stroke="var(--soft)" stroke-width="2.6" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>',
 s:'<svg viewBox="0 0 20 20" fill="none" stroke="var(--mag)" stroke-width="2.8"><circle cx="10" cy="10" r="6.5"/></svg>',
 k:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="var(--ink)"/></svg>'
};
var cols=[]; // cols[step] = массив ячеек этого шага
function renderSheet(){
  if(padMode)return renderRud();
  var p=patterns[cur],sheet=$('#sheet');sheet.innerHTML='';sheet.style.maxWidth='';cols=[];for(var i=0;i<16;i++)cols.push([]);
  function row(cls,label,fn){
    var r=document.createElement('div');r.className='row '+cls;
    var l=document.createElement('div');l.className='rl';l.textContent=label;r.appendChild(l);
    for(var g=0;g<4;g++){
      var gr=document.createElement('div');gr.className='grp'+((g===0||g===2)?' strong':'');
      for(var q=0;q<4;q++){var s=g*4+q;var c=document.createElement('div');c.className='cell';fn(c,s);gr.appendChild(c);cols[s].push(c)}
      r.appendChild(gr);
    }
    sheet.appendChild(r);
    return r;
  }
  function txtRow(sys){
    if(sys==='none')return;
    row('txt','',function(c,s){var L=labelFor(sys,s,p);c.textContent=L.t;if(L.on)c.classList.add('snd');if(L.beat)c.classList.add('beatn')});
  }
  txtRow($('#sysTop').value);
  [['h','Х'],['s','М'],['k','Б']].forEach(function(d){
    var r=row('sym',d[1],function(c,s){if(p[d[0]].indexOf(s)<0)return;c.innerHTML=SYM[d[0]]});
    r.dataset.i=d[0];
  });
  applyMuteLook();
  head(p.id,cur,gsUrl(p));
}
function renderRud(){
  var rd=rudiments[curR],sheet=$('#sheet');sheet.innerHTML='';
  rudH=hands(rd);var n=rudH.length,groups=n/4;cols=[];for(var i=0;i<n;i++)cols.push([]);
  sheet.style.maxWidth=n>=16?'':Math.round(n/16*100+14)+'%';
  function row(cls,label,fn){
    var r=document.createElement('div');r.className='row '+cls;
    var l=document.createElement('div');l.className='rl';l.textContent=label;r.appendChild(l);
    for(var g=0;g<groups;g++){
      var gr=document.createElement('div');gr.className='grp'+((g%2===0)?' strong':'');
      for(var q=0;q<4;q++){var s=g*4+q;var c=document.createElement('div');c.className='cell';fn(c,s);gr.appendChild(c);cols[s].push(c)}
      r.appendChild(gr);
    }
    sheet.appendChild(r);
  }
  var sys=$('#sysTop').value;if(sys==='drum')sys='count';
  if(sys!=='none')row('txt','',function(c,s){var L=labelFor(sys,s,{h:[],s:[],k:[]});c.textContent=L.t;c.classList.add('snd');if(L.beat)c.classList.add('beatn')});
  ['R','L'].forEach(function(h){row('sym',h,function(c,s){
    var x=rudH[s];if(x.h!==h)return;
    c.innerHTML='<span class="hand'+(x.acc?'':' u')+'" style="color:'+(h==='R'?'var(--soft)':'var(--mag)')+'">'+h+'</span>'+(x.acc?'<i class="acc">&gt;</i>':'');
  })});
  head(rd.id,curR,null);
}
function head(name,idx,gs){
  var b=$('#pname'),len=name.length,fs=len>10?30:38;
  b.textContent=name;b.style.fontSize=len>7?fs+'px':'';
  $('.day').style.minWidth=len>7?Math.round(len*fs*.6)+'px':'';
  $$('#chips .chip').forEach(function(c,i){c.setAttribute('aria-pressed',String(i===idx))});
  var g=$('#gs');g.hidden=!gs;if(gs)g.href=gs;
  $('#listTitle').textContent=padMode?'Рудименты':'Паттерны';$('#listRange').textContent=padMode?String(rudiments.length):'303–330';
}
function gsUrl(p){
  function line(a,ch){var s='';for(var i=0;i<16;i++)s+=a.indexOf(i)>=0?ch:'-';return '|'+s+'|'}
  return 'https://montulli.github.io/GrooveScribe/?TimeSig=4/4&Div=16&Tempo='+bpm()+'&Measures=1&H='+line(p.h,'x')+'&S='+line(p.s,'o')+'&K='+line(p.k,'o');
}
function applyMuteLook(){$$('.row.sym').forEach(function(r){r.classList.toggle('muted-row',!mute[r.dataset.i])})}
function renderChips(){
  var c=$('#chips');c.innerHTML='';
  curList().forEach(function(p,i){
    var b=document.createElement('button');b.className='chip';b.textContent=p.id;b.setAttribute('aria-pressed',String(i===curIdx()));
    b.onclick=function(){selectPattern(i)};c.appendChild(b);
  });
}
var padMode=false;
function curList(){return padMode?rudiments:patterns}
function curIdx(){return padMode?curR:cur}
function selectPattern(i){
  if(playing)stop();
  if(padMode){curR=i;prefs.curR=rudiments[i].id}else{cur=i;prefs.cur=patterns[i].id}
  save('groove.prefs',prefs);renderSheet();
}
function go(d){var n=curList().length;selectPattern((curIdx()+d+n)%n)}
$('#prev').onclick=function(){go(-1)};$('#next').onclick=function(){go(1)};
$('#sysTop').onchange=function(){prefs.top=$('#sysTop').value;save('groove.prefs',prefs);renderSheet()};

/* ---------- звук ---------- */
var ctx=null,master,gMet,gPart,noiseBuf;
var samples={k:null,s:null,h:null,c:null};
/* iPad: звук Web Audio глохнет при беззвучном режиме; тихий звуковой элемент переводит сессию в «воспроизведение» */
var silentEl=null;
function unlockIOS(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{
    if(!silentEl){
      var n=8000,buf=new ArrayBuffer(44+n),v=new DataView(buf);
      var w=function(o,s){for(var i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
      w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
      for(var i=0;i<n;i++)v.setUint8(44+i,128);
      silentEl=document.createElement('audio');silentEl.loop=true;silentEl.setAttribute('playsinline','');
      silentEl.src=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
    }
    var p=silentEl.play();if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function ensureCtx(){
  if(ctx){ if(ctx.state==='suspended')ctx.resume(); return ctx }
  unlockIOS();
  var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();
  master=ctx.createGain();
  var comp=ctx.createDynamicsCompressor(); // громкая бочка вместе с малым не должна трещать
  comp.threshold.value=-10;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.15;
  master.connect(comp);comp.connect(ctx.destination);
  gMet=ctx.createGain();gMet.connect(master);gPart=ctx.createGain();gPart.connect(master);
  setVol();
  var n=ctx.sampleRate*0.5,buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=buf;
  return ctx;
}
function setVol(){if(!ctx)return;gMet.gain.value=$('#vMet').value/100;gPart.gain.value=$('#vPart').value/100}
$('#vMet').oninput=$('#vPart').oninput=setVol;

function sampleSrc(buf,t,dest,gain){var s=ctx.createBufferSource();s.buffer=buf;var g=ctx.createGain();g.gain.value=gain||1;s.connect(g);g.connect(dest);s.start(t)}
function voice(inst,t){
  if(inst==='c'){ // метроном: t уже с акцентом через параметр
  }
}
function playKick(t){
  if(samples.k)return sampleSrc(samples.k,t,gPart,1.7);
  var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);
  g.gain.setValueAtTime(2,t);g.gain.exponentialRampToValueAtTime(.001,t+.34);
  o.connect(g);g.connect(gPart);o.start(t);o.stop(t+.35);
}
function playSnare(t){
  if(samples.s)return sampleSrc(samples.s,t,gPart,.9);
  var n=ctx.createBufferSource();n.buffer=noiseBuf;var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1600;
  var ng=ctx.createGain();ng.gain.setValueAtTime(.7,t);ng.gain.exponentialRampToValueAtTime(.001,t+.2);
  n.connect(f);f.connect(ng);ng.connect(gPart);n.start(t);n.stop(t+.22);
  var o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);
  g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(gPart);o.start(t);o.stop(t+.14);
}
function playHat(t){
  if(samples.h)return sampleSrc(samples.h,t,gPart,.7);
  var n=ctx.createBufferSource();n.buffer=noiseBuf;var f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7500;
  var g=ctx.createGain();g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  n.connect(f);f.connect(g);g.connect(gPart);n.start(t);n.stop(t+.08);
}
function playClick(t,accent){
  if(samples.c)return sampleSrc(samples.c,t,gMet,accent?1:.7);
  var o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=accent?1900:1250;
  g.gain.setValueAtTime(accent?.5:.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);
  o.connect(g);g.connect(gMet);o.start(t);o.stop(t+.05);
}

function playStroke(h,acc,t){
  var o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(h==='R'?880:560,t);
  g.gain.setValueAtTime(acc?.9:.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);
  o.connect(g);g.connect(gPart);o.start(t);o.stop(t+.09);
}

/* ---------- планировщик ---------- */
var playing=false,timer=null,raf=null,nextT=0,stepI=0,queue=[],gstep=0;
var on={met:true,count:true,part:true};var mute={h:true,s:true,k:true};
function bpm(){return +$('#bpm').value}
function stepDur(){return 60/bpm()/4}
function scheduleStep(i,t){
  var pos=i<0?i+16:i;
  if(i<0){ if(pos%4===0)playClick(t,pos===0); return pos }
  if(on.met&&pos%4===0)playClick(t,pos===0);
  if(padMode){ // пэд: рудимент играется по кругу, длина цикла своя
    var k=gstep%rudH.length;gstep++;
    if(on.part)playStroke(rudH[k].h,rudH[k].acc,t);
    return k;
  }
  var p=patterns[cur];
  if(on.part){
    if(mute.h&&p.h.indexOf(pos)>=0)playHat(t);
    if(mute.s&&p.s.indexOf(pos)>=0)playSnare(t);
    if(mute.k&&p.k.indexOf(pos)>=0)playKick(t);
  }
  return pos;
}
/* тренировка темпа: каждые N тактов темп растёт на шаг до цели */
var trainOn=false,trBarsDone=0;
function trVal(id,def,min,max){var v=parseInt($(id).value,10);if(isNaN(v))v=def;return Math.max(min,Math.min(max,v))}
function trParams(){return {from:trVal('#trFrom',60,40,160),to:trVal('#trTo',90,40,160),step:trVal('#trStep',2,1,20),bars:trVal('#trBars',4,1,32)}}
function trUpdateMsg(){
  var q=trParams();$('#trainBox').classList.toggle('bad',trainOn&&q.from>=q.to);
}
function onBarDone(){
  if(!trainOn)return;
  var q=trParams();trBarsDone++;
  if(q.from<q.to&&trBarsDone%q.bars===0&&bpm()<q.to)setBpm(Math.min(q.to,bpm()+q.step));
  trUpdateMsg();
}
function sched(){
  while(nextT<ctx.currentTime+.14){
    var pp=scheduleStep(stepI,nextT);queue.push({t:nextT,i:stepI,p:pp});
    nextT+=stepDur();stepI++;if(stepI>=16){stepI=0;onBarDone()}
  }
}
function clearNow(){$$('.cell.now').forEach(function(c){c.classList.remove('now')})}
function setBeats(n){$$('#beats i').forEach(function(d,i){d.classList.toggle('on',i===n)})}
function draw(){
  while(queue.length&&queue[0].t<=ctx.currentTime){
    var e=queue.shift();clearNow();
    var pos=e.i<0?e.i+16:e.i;
    if(e.i>=0&&cols[e.p])cols[e.p].forEach(function(c){c.classList.add('now')});
    if(pos%4===0)setBeats(pos>>2);
  }
  raf=requestAnimationFrame(draw);
}
function start(){
  ensureCtx();playing=true;queue=[];
  if(trainOn){var q=trParams();trBarsDone=0;if(q.from<q.to)setBpm(q.from);trUpdateMsg()}
  stepI=on.count?-16:0;gstep=0;nextT=ctx.currentTime+.08;
  sched();timer=setInterval(sched,25);raf=requestAnimationFrame(draw);
  var b=$('#play');b.textContent='■ Стоп';b.setAttribute('aria-pressed','true');
}
function stop(){
  playing=false;clearInterval(timer);cancelAnimationFrame(raf);queue=[];clearNow();setBeats(-1);
  var b=$('#play');b.textContent='▶ Играть';b.setAttribute('aria-pressed','false');
  trUpdateMsg();
}
function toggle(){playing?stop():start()}
$('#play').onclick=toggle;
document.addEventListener('keydown',function(e){
  var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
});
function setBpm(v){v=Math.max(40,Math.min(160,v));$('#bpm').value=v;$('#bpmv').textContent=v;prefs.bpm=v;save('groove.prefs',prefs)}
$('#bpm').oninput=function(){setBpm(+this.value)};
$('#bpmDown').onclick=function(){setBpm(bpm()-2)};$('#bpmUp').onclick=function(){setBpm(bpm()+2)};
function bindToggle(id,key){var b=$(id);b.onclick=function(){on[key]=!on[key];b.setAttribute('aria-pressed',String(on[key]))}}
bindToggle('#tMet','met');bindToggle('#tCount','count');bindToggle('#tPart','part');

/* ---------- режимы: пэд и тренировка темпа ---------- */
function setMode(pad){
  if(playing)stop();
  padMode=pad;
  $('#mPad').setAttribute('aria-pressed',String(pad));
  $('#padBox').hidden=!pad;renderChips();renderSheet();
}
$('#mPad').onclick=function(){setMode(!padMode)};
$('#tLeft').onclick=function(){if(playing)stop();leadLeft=!leadLeft;this.setAttribute('aria-pressed',String(leadLeft));renderSheet()};
$('#tTrain').onclick=function(){
  trainOn=!trainOn;this.setAttribute('aria-pressed',String(trainOn));$('#trainBox').hidden=!trainOn;trUpdateMsg();
};
['#trFrom','#trTo','#trStep','#trBars'].forEach(function(id){$(id).addEventListener('input',trUpdateMsg)});

/* ---------- старт ---------- */
if(prefs.top)$('#sysTop').value=prefs.top;
if(prefs.bpm)setBpm(prefs.bpm);
if(prefs.cur){var ix=patterns.findIndex(function(p){return p.id===prefs.cur});if(ix>=0)cur=ix}
renderChips();renderSheet();
})();

</script>

<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
